<!DOCTYPE html>
<html>

<head>
    <title>Medicines</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h2>Medicine Inventory</h2>
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Manufacturer</th>
                <th>Actions</th>
            </tr>
            {% for m in medicines %}
            <tr>
                <td>{{ m.medicine_id }}</td>
                <td>{{ m.name }}</td>
                <td>{{ m.category }}</td>
                <td>{{ m.price }}</td>
                <td>{{ m.stock }}</td>
                <td>{{ m.manufacturer }}</td>
                <td>
                    <a href="{{ url_for('edit_medicine', medicine_id=m.medicine_id) }}">Edit
                        Stock</a>
                    <a href="{{ url_for('delete_medicine', medicine_id=m.medicine_id)
}}">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
        <a href="{{ url_for('home') }}">Home</a>
    </div>
</body>

</html>
