<!DOCTYPE html>
<html>

<head>
    <title>Update Stock</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h2>Update Stock</h2>
        <p>{{ medicine.name }}</p>
        <form method="POST">
            <label>New Stock</label>
            <input type="number" name="stock" value="{{ medicine.stock }}" required>
            <button type="submit">Update Stock</button>
        </form>
    </div>
</body>

</html>
