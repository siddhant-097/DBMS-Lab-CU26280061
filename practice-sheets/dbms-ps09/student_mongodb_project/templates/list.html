<!DOCTYPE html>
<html>

<head>
    <title>Students</title>
    <link rel="stylesheet" href="{{ url_for('static',
filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h2>All Students</h2>
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Department</th>
                <th>Marks</th>
                <th>Actions</th>
            </tr>
            {% for s in students %}
            <tr>
                <td>{{ s.student_id }}</td>
                <td>{{ s.name }}</td>
                <td>{{ s.age }}</td>
                <td>{{ s.gender }}</td>
                <td>{{ s.department }}</td>
                <td>{{ s.marks }}</td>
                <td>
                    <a href="{{ url_for('edit_student',
student_id=s.student_id) }}">Edit</a>
                    <a href="{{ url_for('delete_student',
student_id=s.student_id) }}">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
        <a href="{{ url_for('home') }}">Home</a>
    </div>
</body>

</html>
